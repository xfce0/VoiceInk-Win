name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --editable ".[dev]"

      - name: Validate specifications
        run: python scripts/spec_check.py

      - name: Check formatting
        run: python -m ruff format --check src tests scripts

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Test
        run: python -m pytest

      - name: Compile
        run: python -m compileall -q src scripts

  gui-offscreen:
    name: Offscreen GUI contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      VOICEINK_GUI_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development and GUI dependencies
        run: python -m pip install --editable ".[dev,gui]"

      - name: Verify PySide6 is available
        run: python -c "from PySide6.QtWidgets import QApplication; print(QApplication.__name__)"

      - name: Run unavailable presentation contract
        run: python -m pytest tests/test_unavailable_presentation.py
