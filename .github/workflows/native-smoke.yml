name: Native Windows Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 6"

jobs:
  native-smoke:
    runs-on: windows-latest
    env:
      VOICEINK_FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip
      VOICEINK_FFMPEG_ARCHIVE_SHA256: ${{ vars.VOICEINK_FFMPEG_ARCHIVE_SHA256 }}
      VOICEINK_FFMPEG_SHA256: ${{ vars.VOICEINK_FFMPEG_SHA256 }}
      VOICEINK_FFMPEG_VERSION: 7.1.1
      VOICEINK_FFMPEG_PROVENANCE_URL: https://github.com/GyanD/codexffmpeg/releases/tag/7.1.1
      VOICEINK_FFMPEG_LICENSE: GPL-3.0-or-later
      VOICEINK_NATIVE_SMOKE_FIXTURE: ${{ vars.VOICEINK_NATIVE_SMOKE_FIXTURE }}
      VOICEINK_NATIVE_SMOKE_FIXTURE_URL: ${{ vars.VOICEINK_NATIVE_SMOKE_FIXTURE_URL }}
      VOICEINK_NATIVE_SMOKE_FIXTURE_SHA256: ${{ vars.VOICEINK_NATIVE_SMOKE_FIXTURE_SHA256 }}
      VOICEINK_NATIVE_SMOKE_FIXTURE_LICENSE: ${{ vars.VOICEINK_NATIVE_SMOKE_FIXTURE_LICENSE }}
      VOICEINK_SIDECAR_ARCHIVE_URL: ${{ vars.VOICEINK_SIDECAR_ARCHIVE_URL }}
      VOICEINK_SIDECAR_ARCHIVE_SHA256: ${{ vars.VOICEINK_SIDECAR_ARCHIVE_SHA256 }}
      VOICEINK_SIDECAR_EXECUTABLE_SHA256: ${{ vars.VOICEINK_SIDECAR_EXECUTABLE_SHA256 }}
      VOICEINK_SIDECAR_VERSION: ${{ vars.VOICEINK_SIDECAR_VERSION }}
      VOICEINK_SIDECAR_PROVENANCE_URL: ${{ vars.VOICEINK_SIDECAR_PROVENANCE_URL }}
      VOICEINK_SIDECAR_LICENSE: ${{ vars.VOICEINK_SIDECAR_LICENSE }}
      VOICEINK_SIDECAR_MODEL_URL: ${{ vars.VOICEINK_SIDECAR_MODEL_URL }}
      VOICEINK_SIDECAR_MODEL_SHA256: ${{ vars.VOICEINK_SIDECAR_MODEL_SHA256 }}
      VOICEINK_SIDECAR_MODEL_ID: ${{ vars.VOICEINK_SIDECAR_MODEL_ID }}
      VOICEINK_SIDECAR_MODEL_VERSION: ${{ vars.VOICEINK_SIDECAR_MODEL_VERSION }}
      VOICEINK_SIDECAR_MODEL_PROVENANCE_URL: ${{ vars.VOICEINK_SIDECAR_MODEL_PROVENANCE_URL }}
      VOICEINK_SIDECAR_MODEL_LICENSE: ${{ vars.VOICEINK_SIDECAR_MODEL_LICENSE }}
      VOICEINK_SIDECAR_BACKEND: ${{ vars.VOICEINK_SIDECAR_BACKEND }}
      VOICEINK_NATIVE_SMOKE_CANCEL_AFTER_SECONDS: ${{ vars.VOICEINK_NATIVE_SMOKE_CANCEL_AFTER_SECONDS }}
      VOICEINK_NATIVE_SMOKE_ASR_CANCEL_AFTER_SECONDS: ${{ vars.VOICEINK_NATIVE_SMOKE_ASR_CANCEL_AFTER_SECONDS }}
      VOICEINK_NATIVE_SMOKE_REPORT: native-smoke-report.json
      VOICEINK_NATIVE_SMOKE_EVENTS: native-smoke-events.jsonl
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Validate pinned smoke configuration
        shell: pwsh
        run: |
          $required = @(
            "VOICEINK_FFMPEG_ARCHIVE_SHA256",
            "VOICEINK_FFMPEG_SHA256",
            "VOICEINK_NATIVE_SMOKE_FIXTURE_URL",
            "VOICEINK_NATIVE_SMOKE_FIXTURE_SHA256",
            "VOICEINK_NATIVE_SMOKE_FIXTURE_LICENSE",
            "VOICEINK_SIDECAR_ARCHIVE_URL",
            "VOICEINK_SIDECAR_ARCHIVE_SHA256",
            "VOICEINK_SIDECAR_EXECUTABLE_SHA256",
            "VOICEINK_SIDECAR_VERSION",
            "VOICEINK_SIDECAR_PROVENANCE_URL",
            "VOICEINK_SIDECAR_LICENSE",
            "VOICEINK_SIDECAR_MODEL_URL",
            "VOICEINK_SIDECAR_MODEL_SHA256",
            "VOICEINK_SIDECAR_MODEL_ID",
            "VOICEINK_SIDECAR_MODEL_VERSION",
            "VOICEINK_SIDECAR_MODEL_PROVENANCE_URL",
            "VOICEINK_SIDECAR_MODEL_LICENSE",
            "VOICEINK_NATIVE_SMOKE_CANCEL_AFTER_SECONDS",
            "VOICEINK_NATIVE_SMOKE_ASR_CANCEL_AFTER_SECONDS"
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name repository variable is required"
            }
          }
      - name: Install pinned FFmpeg
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VOICEINK_FFMPEG_ARCHIVE_SHA256)) { throw "VOICEINK_FFMPEG_ARCHIVE_SHA256 repository variable is required" }
          if ([string]::IsNullOrWhiteSpace($env:VOICEINK_FFMPEG_SHA256)) { throw "VOICEINK_FFMPEG_SHA256 repository variable is required" }
          Invoke-WebRequest -Uri $env:VOICEINK_FFMPEG_URL -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          $actual = (Get-FileHash "$env:RUNNER_TEMP\ffmpeg.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:VOICEINK_FFMPEG_ARCHIVE_SHA256.ToLowerInvariant()) { throw "FFmpeg archive checksum mismatch" }
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $binary = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if ($null -eq $binary) { throw "ffmpeg.exe was not found in the pinned archive" }
          "VOICEINK_FFMPEG_PATH=$($binary.FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: Install project
        run: python -m pip install --editable ".[dev]"
      - name: Install pinned sidecar and licensed fixture
        shell: pwsh
        run: |
          function Required([string] $name) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) { throw "$name repository variable is required" }
            return $value
          }
          function DownloadVerified([string] $url, [string] $sha, [string] $name) {
            $target = Join-Path $env:RUNNER_TEMP $name
            Invoke-WebRequest -Uri $url -OutFile $target
            $actual = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $sha.ToLowerInvariant()) { throw "$name checksum mismatch" }
            return $target
          }
          $runtimeArchive = DownloadVerified (Required "VOICEINK_SIDECAR_ARCHIVE_URL") (Required "VOICEINK_SIDECAR_ARCHIVE_SHA256") "sidecar.zip"
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "sidecar"
          Expand-Archive $runtimeArchive -DestinationPath $runtimeRoot -Force
          $runtimeCandidates = @(Get-ChildItem $runtimeRoot -Filter nemo-speech.exe -Recurse -File)
          if ($runtimeCandidates.Count -ne 1) {
            throw "expected exactly one nemo-speech.exe in the pinned archive"
          }
          $runtime = $runtimeCandidates[0]
          $model = DownloadVerified (Required "VOICEINK_SIDECAR_MODEL_URL") (Required "VOICEINK_SIDECAR_MODEL_SHA256") "parakeet.gguf"
          $fixture = DownloadVerified (Required "VOICEINK_NATIVE_SMOKE_FIXTURE_URL") (Required "VOICEINK_NATIVE_SMOKE_FIXTURE_SHA256") "native-fixture.bin"
          "VOICEINK_SIDECAR_EXECUTABLE=$($runtime.FullName)" | Out-File $env:GITHUB_ENV -Append
          "VOICEINK_SIDECAR_MODEL=$model" | Out-File $env:GITHUB_ENV -Append
          "VOICEINK_NATIVE_SMOKE_FIXTURE=$fixture" | Out-File $env:GITHUB_ENV -Append
          $lockPath = Join-Path $env:RUNNER_TEMP "voiceink-artifact-lock.json"
          $manifestPath = Join-Path $env:RUNNER_TEMP "voiceink-runtime-manifest.json"
          $lock = @{
            schema = "voiceink.runtime.artifact-lock.v1"
            version = 1
            install_root = $env:RUNNER_TEMP
            artifacts = @{
              "nemo-speech-cpp-windows-amd64" = @{
                kind = "executable"
                version = (Required "VOICEINK_SIDECAR_VERSION")
                provenance_url = (Required "VOICEINK_SIDECAR_PROVENANCE_URL")
                sha256 = (Required "VOICEINK_SIDECAR_EXECUTABLE_SHA256")
                license = (Required "VOICEINK_SIDECAR_LICENSE")
                allowed_path = $runtime.FullName
              }
              (Required "VOICEINK_SIDECAR_MODEL_ID") = @{
                kind = "model"
                version = (Required "VOICEINK_SIDECAR_MODEL_VERSION")
                provenance_url = (Required "VOICEINK_SIDECAR_MODEL_PROVENANCE_URL")
                sha256 = (Required "VOICEINK_SIDECAR_MODEL_SHA256")
                license = (Required "VOICEINK_SIDECAR_MODEL_LICENSE")
                allowed_path = $model
              }
            }
          }
          $lock | ConvertTo-Json -Depth 8 | Set-Content -Path $lockPath -Encoding utf8
          $manifest = @{
            schema = "voiceink.runtime.manifest.v1"
            version = 1
            executable_artifact_id = "nemo-speech-cpp-windows-amd64"
            model_artifact_id = (Required "VOICEINK_SIDECAR_MODEL_ID")
            backend = if ([string]::IsNullOrWhiteSpace($env:VOICEINK_SIDECAR_BACKEND)) { "cpu" } else { $env:VOICEINK_SIDECAR_BACKEND }
            endpoint = "ephemeral-loopback"
            executable = $runtime.FullName
            model = $model
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path $manifestPath -Encoding utf8
          $lockSha256 = (Get-FileHash $lockPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "VOICEINK_ARTIFACT_LOCK=$lockPath" | Out-File $env:GITHUB_ENV -Append
          "VOICEINK_ARTIFACT_LOCK_SHA256=$lockSha256" | Out-File $env:GITHUB_ENV -Append
          "VOICEINK_RUNTIME_MANIFEST=$manifestPath" | Out-File $env:GITHUB_ENV -Append
      - name: Run native smoke
        run: python scripts/native_smoke.py
      - name: Upload native smoke report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        with:
          name: native-smoke-report
          path: |
            native-smoke-report.json
            native-smoke-events.jsonl
          if-no-files-found: warn
