name: Windows Release Package Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    tags:
      - "release-v*"

permissions:
  contents: read

concurrency:
  group: windows-release-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-smoke:
    name: Build and smoke-test Windows x64 release package
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Pin PR lock to base revision
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $lock = Join-Path $env:RUNNER_TEMP "voiceink-release-lock.json"
          git show "${{ github.event.pull_request.base.sha }}:.github/native-smoke/artifact-lock.template.json" | Out-File $lock -Encoding utf8
          "WINDOWS_RELEASE_LOCK=$lock" | Out-File $env:GITHUB_ENV -Append

      - name: Build, package, and run relocation smoke
        shell: bash
        run: make windows-release-smoke

      - name: Upload Windows release bundle and smoke report
        if: success()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        with:
          name: voiceink-shell-windows-x64-release
          path: |
            release/voiceink-shell-windows-x64.zip
            release/windows-release-smoke.json
          if-no-files-found: error
