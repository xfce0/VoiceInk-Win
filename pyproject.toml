[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceink-win"
version = "0.1.0.dev0"
description = "Windows desktop voice-to-text application inspired by VoiceInk"
requires-python = ">=3.12,<3.15"
readme = "README.md"
license = { text = "GPL-3.0-only" }
authors = [{ name = "VoiceInk-Win contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "PyYAML>=6.0,<7",
    "ruff>=0.9,<1",
]
gui = [
    "PySide6==6.12.0",
]
build = [
    "Pillow==12.3.0",
    "pyinstaller==6.22.3",
]

[project.scripts]
voiceink-win-shell = "voiceink_win.presentation.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"voiceink_win.infrastructure" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
